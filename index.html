<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora Notes — Beautiful Notes App</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <meta name="description" content="A beautiful notes app built with Bootstrap & jQuery. Save, edit, delete, search, and tag your notes locally.">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Aurora Notes</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <button id="exportBtn" class="btn btn-outline-info btn-sm me-2">Export</button>
        </li>
        <li class="nav-item">
          <input id="importFile" type="file" accept="application/json" class="d-none">
          <button id="importBtn" class="btn btn-outline-success btn-sm">Import</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row g-4">
    <aside class="col-lg-4">
      <div class="card editor-card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Create a note</h5>
          <div class="mb-2">
            <input id="noteTitle" class="form-control form-control-lg" placeholder="Title (optional)">
          </div>
          <div class="mb-2">
            <textarea id="noteContent" class="form-control" rows="6" placeholder="Write something beautiful..."></textarea>
          </div>
          <div class="mb-3">
            <input id="noteTags" class="form-control" placeholder="Tags (comma separated)">
          </div>
          <div class="d-flex gap-2">
            <button id="saveNote" class="btn btn-primary flex-grow-1">Save Note</button>
            <button id="clearForm" class="btn btn-outline-secondary">Clear</button>
          </div>
        </div>
      </div>

      <div class="card mt-4 shadow-sm search-card">
        <div class="card-body">
          <h6 class="mb-2 text-white">Search & filter</h6>
          <input id="searchInput" class="form-control mb-2" placeholder="Search notes...">
          <select id="tagFilter" class="form-select mb-2">
            <option value="">Filter by tag (all)</option>
          </select>
          <div class="d-flex gap-2">
            <select id="sortSelect" class="form-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="title">Title (A–Z)</option>
            </select>
            <button id="clearAll" class="btn btn-danger">Clear All</button>
          </div>
        </div>
      </div>
    </aside>

    <section class="col-lg-8">
      <div id="notesGrid" class="row row-cols-1 row-cols-md-2 g-3"></div>
    </section>

  </div>
</main>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
